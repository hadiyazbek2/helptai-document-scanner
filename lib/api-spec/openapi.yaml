openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: processing
    description: Document processing operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /process-document:
    post:
      operationId: processDocument
      tags: [processing]
      summary: Analyze selected document frames
      description: Sends locally filtered document frames to Gemini for ordered text extraction and confidence scoring.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessDocumentInput"
      responses:
        "200":
          description: Reconstructed document analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessDocumentResult"
        "400":
          description: Invalid frames
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: AI usage limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: AI declined to transcribe these frames
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: AI analysis unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI temporarily busy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Calm, plain-language message that can be shown to the user.
        code:
          type: string
          enum: [bad_request, quota, busy, invalid_output, blocked, unavailable]
      required:
        - error
        - code
    ProcessFrame:
      type: object
      properties:
        dataUrl:
          type: string
          minLength: 32
        timestamp:
          type: number
          minimum: 0
        sharpness:
          type: number
          minimum: 0
        difference:
          type: number
          minimum: 0
      required:
        - dataUrl
        - timestamp
        - sharpness
        - difference
    ProcessDocumentInput:
      type: object
      properties:
        documentName:
          type: string
          minLength: 1
          maxLength: 160
        frames:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/ProcessFrame"
      required:
        - documentName
        - frames
    ReconstructedPage:
      type: object
      properties:
        pageNumber:
          type: integer
          minimum: 1
        title:
          type: string
        text:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        needsReview:
          type: boolean
        reviewReason:
          type: ["string", "null"]
        sourceFrameIndices:
          type: array
          description: Zero-based indices (into the request frames) of every frame that shows this page.
          minItems: 1
          items:
            type: integer
            minimum: 0
        bestFrameIndex:
          type: integer
          minimum: 0
          description: Zero-based index of the frame that shows this page most clearly. Always one of sourceFrameIndices.
        modelUsed:
          type: string
          description: Gemini model that produced this page.
      required:
        - pageNumber
        - title
        - text
        - confidence
        - needsReview
        - reviewReason
        - sourceFrameIndices
        - bestFrameIndex
    ProcessDocumentResult:
      type: object
      properties:
        documentName:
          type: string
        pages:
          type: array
          items:
            $ref: "#/components/schemas/ReconstructedPage"
        selectedFrameCount:
          type: integer
        discardedFrameCount:
          type: integer
        processingNote:
          type: string
      required:
        - documentName
        - pages
        - selectedFrameCount
        - discardedFrameCount
        - processingNote

